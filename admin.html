<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademicNexa Pro | Admin Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #243047;
    line-height: 1.6;
}

header {
    background: #103d73;
    color: white;
    padding: 22px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

header h1 {
    font-size: 23px;
}

header span {
    color: #f0a500;
}

main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.panel {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    margin-bottom: 25px;
}

h2 {
    color: #103d73;
    margin-bottom: 18px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin: 9px 0 18px;
    border: 1px solid #d5dfeb;
    border-radius: 7px;
    font-size: 15px;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
}

.primary {
    background: #1456a0;
    color: white;
}

.approve {
    background: #16834a;
    color: white;
}

.reject {
    background: #d97706;
    color: white;
}

.delete {
    background: #c62828;
    color: white;
}

.logout {
    background: #f0a500;
    color: #17263c;
}

.review-card {
    border: 1px solid #e3eaf2;
    border-radius: 10px;
    padding: 22px;
    margin: 18px 0;
    background: #fff;
}

.review-card h3 {
    color: #103d73;
    margin-bottom: 8px;
}

.stars {
    color: #f0a500;
    font-size: 20px;
}

.hidden {
    display: none;
}

#login-status, #dashboard-status {
    margin-top: 12px;
    color: #b42318;
}

@media(max-width: 600px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }

    .panel {
        padding: 20px;
    }
}
.summary-cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;
    margin: 25px 0;
}

.summary-card {
    background: #ffffff;
    border-left: 5px solid #1456a0;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 4px 12px rgba(16, 61, 115, 0.08);
}

.summary-card h3 {
    color: #103d73;
    font-size: 15px;
    margin-bottom: 10px;
}

.summary-card p {
    color: #1456a0;
    font-size: 30px;
    font-weight: bold;
}

@media (max-width: 750px) {
    .summary-cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 450px) {
    .summary-cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Academic<span>Nexa Pro</span> | Admin</h1>
    <button id="logout-button" class="logout hidden">
        Log Out
    </button>
</header>

<main>

    <section id="login-panel" class="panel">
        <h2>Administrator Login</h2>

        <form id="login-form">
            <label for="admin-email">Email Address</label>
            <input type="email" id="admin-email" required>

            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" required>

            <button type="submit" class="primary">
                Log In
            </button>
        </form>

        <p id="login-status" aria-live="polite"></p>
    </section>

    <section id="dashboard-panel" class="panel hidden">
        <h2>Student Review Management</h2>
        <div class="summary-cards">
    <div class="summary-card">
        <h3>Total Reviews</h3>
        <p id="total-reviews">0</p>
    </div>

    <div class="summary-card">
        <h3>Pending Reviews</h3>
        <p id="pending-reviews">0</p>
    </div>

    <div class="summary-card">
        <h3>Approved Reviews</h3>
        <p id="approved-reviews">0</p>
    </div>

    <div class="summary-card">
        <h3>Rejected Reviews</h3>
        <p id="rejected-reviews">0</p>
    </div>
</div>

        <p>Manage submitted student reviews below.</p>

        <p id="dashboard-status" aria-live="polite"></p>

        <div id="admin-reviews">
            Loading reviews...
        </div>
    </section>

</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
'https://pnherqvwcijxxpmvkult.supabase.co';

const SUPABASE_KEY =
'sb_publishable_puPHAUDfnQTwLV9al2phBA_jJb_wlLU';

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const loginPanel = document.getElementById('login-panel');
const dashboardPanel = document.getElementById('dashboard-panel');
const loginStatus = document.getElementById('login-status');
const dashboardStatus = document.getElementById('dashboard-status');
const reviewsContainer = document.getElementById('admin-reviews');
const logoutButton = document.getElementById('logout-button');

async function checkAdmin() {
    const { data: { session } } =
        await supabase.auth.getSession();

    if (!session) {
        showLogin();
        return;
    }

    const { data: admin, error } = await supabase
        .from('review_admins')
        .select('user_id')
        .eq('user_id', session.user.id)
        .maybeSingle();

    if (error || !admin) {
        await supabase.auth.signOut();
        showLogin();
        loginStatus.textContent =
            'Administrator access could not be verified.';
        return;
    }

    loginPanel.classList.add('hidden');
    dashboardPanel.classList.remove('hidden');
    logoutButton.classList.remove('hidden');

    loadReviews();
}

function showLogin() {
    loginPanel.classList.remove('hidden');
    dashboardPanel.classList.add('hidden');
    logoutButton.classList.add('hidden');
}

document.getElementById('login-form')
.addEventListener('submit', async event => {
    event.preventDefault();

    loginStatus.textContent = 'Signing in...';

    const email =
        document.getElementById('admin-email').value.trim();

    const password =
        document.getElementById('admin-password').value;

    const { error } = await supabase.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        loginStatus.textContent =
            'Login failed. Check your email and password.';
        return;
    }

    loginStatus.textContent = '';
    await checkAdmin();
});

function updateSummary(reviews) {
    document.getElementById('total-reviews').textContent =
        reviews.length;

    document.getElementById('pending-reviews').textContent =
        reviews.filter(review => review.status === 'pending').length;

    document.getElementById('approved-reviews').textContent =
        reviews.filter(review => review.status === 'approved').length;

    document.getElementById('rejected-reviews').textContent =
        reviews.filter(review => review.status === 'rejected').length;
}
    async function loadReviews() {
    reviewsContainer.textContent = 'Loading reviews...';

    const { data, error } = await supabase
        .from('student_reviews')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) {
        reviewsContainer.textContent =
            'Could not load reviews. Please check your access.';
        return;
    }

    updateSummary(data || []);
    reviewsContainer.replaceChildren();

    if (!data || data.length === 0) {
        reviewsContainer.textContent = 'No reviews submitted yet.';
        return;
    }

    data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'review-card';

        const name = document.createElement('h3');
        name.textContent = item.student_name;

        const stars = document.createElement('p');
        stars.className = 'stars';
        stars.textContent =
            '★'.repeat(item.rating) +
            '☆'.repeat(5 - item.rating);

        const service = document.createElement('p');
        service.textContent =
            'Service: ' + (item.service || 'Not specified');

        const review = document.createElement('p');
        review.textContent = item.review;

        const status = document.createElement('p');
        status.textContent = 'Status: ' + item.status;

        const approve = document.createElement('button');
        approve.className = 'approve';
        approve.textContent = 'Approve';

        approve.addEventListener('click', () =>
            updateReview(item.id, 'approved')
        );

        const reject = document.createElement('button');
        reject.className = 'reject';
        reject.textContent = 'Reject';

        reject.addEventListener('click', () =>
            updateReview(item.id, 'rejected')
        );

        const remove = document.createElement('button');
        remove.className = 'delete';
        remove.textContent = 'Delete';

        remove.addEventListener('click', () =>
            deleteReview(item.id)
        );

        card.append(
            name, stars, service, review, status,
            approve, reject, remove
        );

        reviewsContainer.append(card);
    });
}

async function updateReview(id, status) {
    const { error } = await supabase
        .from('student_reviews')
        .update({ status })
        .eq('id', id);

    if (error) {
        dashboardStatus.textContent =
            'Could not update the review.';
        return;
    }

    dashboardStatus.textContent =
        'Review updated successfully.';

    loadReviews();
}

async function deleteReview(id) {
    if (!confirm('Are you sure you want to delete this review?')) {
        return;
    }

    const { error } = await supabase
        .from('student_reviews')
        .delete()
        .eq('id', id);

    if (error) {
        dashboardStatus.textContent =
            'Could not delete the review.';
        return;
    }

    dashboardStatus.textContent =
        'Review deleted successfully.';

    loadReviews();
}

logoutButton.addEventListener('click', async () => {
    await supabase.auth.signOut();
    showLogin();
});

supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
        showLogin();
    }
});

checkAdmin();
</script>

</body>
</html>
